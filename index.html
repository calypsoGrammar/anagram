<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="./src/stylesheets/style.css">
    <title>Anagram</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/modern-normalize@v1.1.0/modern-normalize.min.css" rel="stylesheet">
  </head>
  <body class='min-h-screen max-h-screen w-full'>

    <div class="flex flex-row justify-center items-center border-b border-black h-10">

      <label for="anagramText" class="sr-only">Text to anagram</label>
      <input type="text" id="anagramText" placeholder="Enter Search Text Here" class="flex justify-center items-center w-1/2 h-full px-2">
      <label for="dictionary" class="sr-only">Dictionary</label>
      <select name="dictionary" id="dictionary" class="flex justify-center items-center text-center w-1/4 h-full">
        <option value=0 selected>1,000</option>
        <option value=1>10,000</option>
        <option value=2>20,000</option>
        <option value=3>Small</option>
        <option value=4>Medium</option>
        <option value=5>Large</option>
      </select>

      <div class="flex justify-center items-center w-1/4 h-full">
        <button id="activateButton" type="button" aria-label="Search for anagrams" class="flex justify-center items-center w-full h-full active:scale-95"><img id="searchButton" src="/search.svg" alt=""></button>
      </div>

    </div>

    <div id="filters" role="group" aria-label="Result filters" class="mx-auto flex flex-row w-full h-10 border-b border-black">

      <div class="w-1/2 h-full flex justify-center items-center">
        <label for="filterWords" class="sr-only">Filter words</label>
        <input type="text" id="filterWords" placeholder="Filter" class="w-3/4 h-full px-2">
        <label for="wordLengths" class="sr-only">Filter words by length</label>
        <select name="wordLengths" id="wordLengths" class="w-1/4 h-full text-center">
          <option value="">-</option>
        </select>
      </div>
  
      <div class="w-1/2 h-full flex justify-center items-center">
        <label for="filterSets" class="sr-only">Filter anagram sets</label>
        <input type="text" id="filterSets" placeholder="Filter" class="w-3/4 h-full px-2">
        <label for="setLengths" class="sr-only">Filter anagram sets by length</label>
        <select name="setLengths" id="setLengths" class="w-1/4 h-full text-center">
          <option value="">-</option>
        </select>
      </div>
  
    </div>
  
  <main id="results" class="flex flex-row w-full">
    <section aria-labelledby="wordsHeading" class="flex flex-col justify-start align-start content-start w-1/2">
      <h2 id="wordsHeading" class="sr-only">Words</h2>
      <div id="resultDiv" class="flex flex-col justify-start align-start content-start w-full"></div>
    </section>
    <section aria-labelledby="setsHeading" class="flex flex-col justify-start align-start content-start w-1/2">
      <h2 id="setsHeading" class="sr-only">Anagram sets</h2>
      <p id="anagramSearchStatus" role="status" aria-live="polite" aria-atomic="true" class="px-2 text-sm"></p>
      <div id="resultDiv2"></div>
    </section>
  </main>

  </body>
  <script type='module' src="./src/javascripts/main.js"></script>
</html>
