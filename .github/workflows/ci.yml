name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # Archon's own pull requests are verified on the droplet before they are published
    # (archon.verify posts this check's status). This job runs on main, on people's branches and
    # pull requests, and on any branch when started by hand.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref || github.ref_name, 'archon/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
